include:
  - project: "waldur/waldur-pipelines"
    file: "/templates/stages.yml"
  - project: "waldur/waldur-pipelines"
    file: "/templates/test/check-merge-compatibility.yml"
  - project: "waldur/waldur-pipelines"
    file: "/templates/test/lint-md-files.yml"
  - project: "waldur/waldur-pipelines"
    file: "/templates/release/python-module-release.yml"

.base_job:
  image: registry.hpc.ut.ee/mirror/library/python:3.12
  stage: test
  interruptible: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - apt-get update
    - pip install poetry
    - poetry install

Run lint:
  extends: .base_job
  script:
    - poetry run pre-commit run -a

Run tests:
  extends: .base_job
  script:
    - poetry run pytest -s src/tests/
